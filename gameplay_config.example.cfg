; Example gameplay config for SCP: Noirverse.
;
; The game creates its own copy the first time a match starts, at:
;   Windows: %APPDATA%\SCP-Noirverse\gameplay_config.cfg
; Edit that file (with Notepad) and start a new match to apply changes.
;
; [round]:
;   spawn_queue: who spawns, in order. D = Class-D, S = Scientist,
;     G = Facility Guard, C = Containment Captain. The first player_count
;     letters are used (repeats if shorter). You get a random one of them.
;   player_count: characters per round (you + bots), 1-40.
;   round_time_limit_minutes: 0 = no time limit.
;   friendly_fire: true/false - can teammates hurt each other?
;   restart_delay_seconds: pause between rounds.
;
; [item_limits]: how many items of each category a player can carry.
;   Any value from 0 to 8 (8 = total inventory slots).
;   0 = that kind of item can't be picked up at all.
;   Armor adds bonuses on top (see README).
;
; [ammo_*]: maximum spare rounds per ammo type, depending on the armor worn.
;   Any value from 0 to 65535. Unlike items, 0 means UNLIMITED.

[round]

spawn_queue="DSDGDSCDGDSD"
player_count=10
round_time_limit_minutes=20.0
friendly_fire=false
restart_delay_seconds=15.0

[item_limits]

scp_items=3
keycards=3
treatment_items=3
firearms=1
grenades=2
radios=1
special_weapons=1
armor=1

[ammo_no_armor]

9x19mm=40
556x45mm=40
762x39mm=40
12_70_buckshot=14
44_mag=18

[ammo_light_armor]

9x19mm=70
556x45mm=40
762x39mm=40
12_70_buckshot=14
44_mag=18

[ammo_combat_armor]

9x19mm=170
556x45mm=120
762x39mm=120
12_70_buckshot=54
44_mag=48

[ammo_heavy_armor]

9x19mm=210
556x45mm=200
762x39mm=200
12_70_buckshot=74
44_mag=68
