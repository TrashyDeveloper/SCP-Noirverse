; Example gameplay config for SCP: Noirverse.
;
; The game creates its own copy the first time a match starts, at:
;   Windows: %APPDATA%\Godot\app_userdata\SCP Noirverse\gameplay_config.cfg
; Edit that file (with Notepad) and restart the match to apply changes.
;
; [item_limits]: how many items of each category a player can carry.
;   Any value from 0 to 8 (8 = total inventory slots).
;   0 = that kind of item can't be picked up at all.
;   Armor adds bonuses on top (see README).
; [ammo_limits]: maximum spare rounds per ammo type.

[item_limits]

scp_items=3
keycards=3
treatment_items=3
firearms=1
grenades=2
radios=1
special_weapons=1
armor=1

[ammo_limits]

9mm=120
